name: Build Relivo Agent
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relivo-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge:
    name: Generate bridge / Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: 3.24.5
            sha256: a7c82f551a9eae018e078f6bb186171e5a77920d35a3d75a61d9a593d0a9e4ae
          - flutter: 3.44.9
            sha256: a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Match Flutter 3.44 sources
        if: matrix.flutter == '3.44.9'
        working-directory: rustdesk
        run: bash .github/patches/apply_flutter_3.44_source_patches.sh
      - name: Build pinned bridge environment
        run: >-
          docker build -f agent/build/linux.Dockerfile
          --build-arg FLUTTER_VERSION=${{ matrix.flutter }}
          --build-arg FLUTTER_SHA256=${{ matrix.sha256 }}
          -t relivo-bridge .
      - name: Generate matching native bridge
        run: |
          docker run --rm --user 0:0 -e CI=true -e RELIVO_ALLOW_BRIDGE_GENERATION=owner-authorized \
            -v "$PWD/rustdesk:/work" -v "$PWD/agent/build:/build-scripts:ro" \
            relivo-bridge bash /build-scripts/bridge-command.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-${{ matrix.flutter }}
          retention-days: 14
          if-no-files-found: error
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h
            rustdesk/flutter/ios/Runner/bridge_generated.h

  native:
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    needs: bridge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            triplet: x64-windows-static
            flutter: 3.24.5
          - os: macos-15-intel
            arch: x64
            triplet: x64-osx
            flutter: 3.24.5
          - os: macos-15
            arch: arm64
            triplet: arm64-osx
            flutter: 3.44.9
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-${{ matrix.flutter }}
          path: rustdesk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: rustdesk
          key: relivo-${{ matrix.triplet }}
      - name: Install official Flutter SDK and verify checksum
        run: python3 agent/build/install-flutter.py '${{ matrix.arch }}'
      - name: Disable SDK analytics
        run: flutter config --no-analytics
      - name: Install Windows LLVM
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: 15.0.6
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm gnu-sed pkg-config
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip -o "$RUNNER_TEMP/nasm.zip"
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nasm-2.16.03" >> "$GITHUB_PATH"
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false
      - name: Build software codec dependencies
        run: >-
          "$VCPKG_ROOT/vcpkg" install --triplet '${{ matrix.triplet }}'
          --x-manifest-root="$PWD/agent/build"
          --x-install-root="$VCPKG_ROOT/installed"
      - name: Compile, test and package native agent
        run: python3 agent/build/build-native.py '${{ matrix.arch }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relivo-agent-${{ runner.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
