# Initial certificate issuance only. Replace with relivo.conf after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name relivo-desk.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/relivo-acme;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
